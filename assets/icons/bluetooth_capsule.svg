<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Capsule background -->
  <rect x="64" y="192" width="896" height="640" rx="320" ry="320" fill="url(#bgGrad)" />
  
  <!-- Inner capsule -->
  <rect x="128" y="256" width="768" height="512" rx="256" ry="256" fill="url(#innerGrad)" opacity="0.9"/>
  
  <!-- Bluetooth "B" symbol -->
  <g transform="translate(512, 512) scale(1.2)" filter="url(#glow)">
    <path d="M -120,-200 
             C -120,-280 -40,-280 0,-200
             C 40,-120 40,-40 0,40
             C -40,120 -120,120 -120,200
             L -160,200
             L -160,-200 Z" 
          fill="none" stroke="white" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Diagonal bar -->
    <line x1="-100" y1="-60" x2="60" y2="100" stroke="white" stroke-width="42" stroke-linecap="round"/>
  </g>
  
  <!-- Top highlight -->
  <rect x="128" y="256" width="768" height="180" rx="256" ry="256" fill="white" opacity="0.08"/>
</svg>
