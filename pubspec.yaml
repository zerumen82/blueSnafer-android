name: bluesnafer_pro
version: 1.3.2+12

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth dependencies
  flutter_blue_plus: ^2.1.0

  # Core dependencies
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0

  # UI and utilities
  provider: ^6.1.5
  cupertino_icons: ^1.0.8

  # Network
  http: ^1.5.0
  connectivity_plus: ^7.0.0

  # System utilities
  uuid: ^4.5.1
  encrypt: ^5.0.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/bluetooth_capsule.png"
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: "assets/icons/bluetooth_capsule.png"
  remove_alpha_ios: true
